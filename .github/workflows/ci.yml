name: 검증
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: samkim-main-delivery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 backport fixes (#2524)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - run: node dist/slack.js --help
      - run: npm run test:deployment
      - name: Hosted-only linux/amd64 image build and secret-free smoke (no push/signing)
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --build-arg VCS_REF="$SHA" --build-arg SOURCE_URL=https://github.com/spread-one/my-mastra -t my-mastra:ci-smoke .
          bash deploy/smoke.sh my-mastra:ci-smoke
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'spread-one/my-mastra'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: samkim-ghcr-mutation
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 backport fixes (#2524)
      - name: Refuse an outdated main publication
        env:
          SHA: ${{ github.sha }}
        run: |
          test "$(timeout 15s git ls-remote https://github.com/spread-one/my-mastra.git refs/heads/main | cut -f1)" = "$SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish full SHA (no latest tag, no secret build arguments or remote caches)
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/spread-one/my-mastra:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/spread-one/my-mastra
          labels: |
            org.opencontainers.image.source=https://github.com/spread-one/my-mastra
            org.opencontainers.image.revision=${{ github.sha }}
          # Labels are metadata, NOT cryptographic build provenance.
          # Keyless digest signature below; no separate build provenance attestation.
          provenance: false
          sbom: false
      - name: Verify published metadata and record digest
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE="ghcr.io/spread-one/my-mastra@$DIGEST"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SHA"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE")" = 'https://github.com/spread-one/my-mastra'
          test "$(timeout 15s git ls-remote https://github.com/spread-one/my-mastra.git refs/heads/main | cut -f1)" = "$SHA"
          printf 'Published main `%s`\n\n`%s` (linux/amd64, verified OCI source/revision labels)\n' "$SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned official Cosign (checksum before execution)
        run: python3 -I deploy/cosign_download.py "$RUNNER_TEMP/cosign"
      - name: GitHub OIDC keyless sign and verify exact main workflow digest
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(timeout 15s git ls-remote https://github.com/spread-one/my-mastra.git refs/heads/main | cut -f1)" = "$SHA"
          IMAGE="ghcr.io/spread-one/my-mastra@$DIGEST"
          timeout 60s "$RUNNER_TEMP/cosign" sign --yes "$IMAGE"
          timeout 30s "$RUNNER_TEMP/cosign" verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/spread-one/my-mastra/.github/workflows/ci.yml@refs/heads/main \
            "$IMAGE" >/dev/null
          printf '\nKeyless digest signature verified for exact main workflow (not build provenance).\n' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: [check, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'spread-one/my-mastra'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: selfhost
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 backport fixes (#2524)
      - name: Fail fast if private deployment auth is not configured
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TS_CI_TAG: ${{ vars.TS_CI_TAG }}
          TS_SERVER_TAG: ${{ vars.TS_SERVER_TAG }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          SHA: ${{ github.sha }}
          DIGEST: ghcr.io/spread-one/my-mastra@${{ needs.publish.outputs.digest }}
        run: bash deploy/ci-deploy.sh --check
      - name: Ephemeral tagged Tailscale client (no persistent runner or SSH key)
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_CI_TAG }}
          version: '1.82.0'
          timeout: 60s
          retry: '1'
          tailscaled-args: --tun=userspace-networking
          args: --accept-routes=false --accept-dns=true
      - name: Native Tailscale SSH — report actual health/rollback result
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          TS_CI_TAG: ${{ vars.TS_CI_TAG }}
          TS_SERVER_TAG: ${{ vars.TS_SERVER_TAG }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          SHA: ${{ github.sha }}
          DIGEST: ghcr.io/spread-one/my-mastra@${{ needs.publish.outputs.digest }}
        run: bash deploy/ci-deploy.sh
      - name: Remove ephemeral tailnet session
        if: always()
        run: |
          if command -v tailscale >/dev/null; then
            timeout 15s sudo tailscale logout >/dev/null 2>&1 || echo 'ci tailscale_logout_deferred'
          fi
